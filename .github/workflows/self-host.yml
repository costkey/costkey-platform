name: Self-host image

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - Dockerfile.selfhost
      - docker-compose.yml
      - docker-compose.build.yml
      - .dockerignore
      - scripts/install-linux-native.mjs
      - package-lock.json
      - packages/server/**
      - packages/dashboard/**
      - packages/shared/**
      - deploy/**
      - .github/workflows/self-host.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/costkey/costkey

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      COSTKEY_JWT_SECRET: ci-self-host-jwt-secret
      COSTKEY_NOTIFICATION_ENCRYPTION_KEY: ci-self-host-notification-key
      COMPOSE_FILE: docker-compose.yml:docker-compose.build.yml
    steps:
      - uses: actions/checkout@v4

      - name: Build and start with Docker Compose
        run: docker compose up -d --build

      - name: Smoke test
        run: |
          for i in $(seq 1 60); do curl -fsS http://localhost:4100/health && break; sleep 2; done
          curl -fsS http://localhost:4100/health
          curl -fsS http://localhost:4100/login | grep -q 'id="root"'
          signup=$(curl -fsS -c cookies.txt -X POST http://localhost:4100/auth/signup \
            -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-1","name":"CI","orgName":"CI"}')
          echo "$signup" | grep -q '"dsn":"http://ck_[a-z0-9]*@localhost:4100/'
          curl -fsS -b cookies.txt http://localhost:4100/auth/me | grep -q 'ci@example.com'

      - name: Server logs
        if: always()
        run: |
          docker compose ps -a
          docker compose logs costkey --tail 200

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint the chart
        run: helm lint deploy/helm/costkey
      - uses: helm/kind-action@v1
      - name: Build the image into the cluster
        run: |
          docker build -f Dockerfile.selfhost -t costkey:ci .
          kind load docker-image costkey:ci --name chart-testing
      - name: Install the chart
        run: |
          helm install costkey deploy/helm/costkey --set image.repository=costkey --set image.tag=ci \
            --set image.pullPolicy=Never --set postgres.storage=1Gi --wait --timeout 8m
      - name: Smoke test
        run: |
          kubectl port-forward svc/costkey 4100:80 >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:4100/health && break; sleep 2; done
          signup=$(curl -fsS -X POST http://localhost:4100/auth/signup -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-1","name":"CI","orgName":"CI"}')
          echo "$signup" | grep -q '"dsn":"http://ck_[a-z0-9]*@localhost:4100/'
      - name: Upgrades keep the generated secrets
        run: |
          before=$(kubectl get secret costkey -o jsonpath='{.data.COSTKEY_JWT_SECRET}')
          helm upgrade costkey deploy/helm/costkey --reuse-values --wait --timeout 5m
          after=$(kubectl get secret costkey -o jsonpath='{.data.COSTKEY_JWT_SECRET}')
          test -n "$before" && test "$before" = "$after"
      - name: Cluster state
        if: always()
        run: |
          kubectl get pods -o wide
          kubectl logs deploy/costkey --tail 100 || true

  publish:
    needs: [smoke, kubernetes]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=CostKey
            org.opencontainers.image.description=Self-hosted CostKey: cost, latency, failures and quality for AI agents
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.selfhost
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: azure/setup-helm@v4
        if: startsWith(github.ref, 'refs/tags/v')
      - name: Publish the Helm chart
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/costkey --version "$version" --app-version "$version"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "costkey-${version}.tgz" oci://ghcr.io/costkey/charts
