name: Self-host image

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - Dockerfile.selfhost
      - docker-compose.yml
      - docker-compose.build.yml
      - .dockerignore
      - scripts/install-linux-native.mjs
      - package-lock.json
      - packages/server/**
      - packages/dashboard/**
      - packages/shared/**
      - .github/workflows/self-host.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/costkey/costkey

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      COSTKEY_JWT_SECRET: ci-self-host-jwt-secret
      COSTKEY_NOTIFICATION_ENCRYPTION_KEY: ci-self-host-notification-key
      COMPOSE_FILE: docker-compose.yml:docker-compose.build.yml
    steps:
      - uses: actions/checkout@v4

      - name: Build and start with Docker Compose
        run: docker compose up -d --build

      - name: Smoke test
        run: |
          for i in $(seq 1 60); do curl -fsS http://localhost:4100/health && break; sleep 2; done
          curl -fsS http://localhost:4100/health
          curl -fsS http://localhost:4100/login | grep -q 'id="root"'
          signup=$(curl -fsS -c cookies.txt -X POST http://localhost:4100/auth/signup \
            -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-1","name":"CI","orgName":"CI"}')
          echo "$signup" | grep -q '"dsn":"http://ck_[a-z0-9]*@localhost:4100/'
          curl -fsS -b cookies.txt http://localhost:4100/auth/me | grep -q 'ci@example.com'

      - name: Server logs
        if: always()
        run: |
          docker compose ps -a
          docker compose logs costkey --tail 200

  publish:
    needs: smoke
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=CostKey
            org.opencontainers.image.description=Self-hosted CostKey: cost, latency, failures and quality for AI agents
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.selfhost
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
