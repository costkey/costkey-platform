version: "3.8"

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "4100:4100"
    environment:
      - NODE_ENV=production
      - PORT=4100
      - COSTKEY_JWT_SECRET=${COSTKEY_JWT_SECRET:-change-this-in-production}
      - COSTKEY_DATA_DIR=/data
    volumes:
      - costkey-data:/data
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  costkey-data:
